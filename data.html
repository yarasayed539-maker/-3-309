<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevHub - Interactive Data Table</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">DevHub</a>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="components.html">Components</a></li>
        <li><a href="validation.html">Validation</a></li>
        <li><a class="active" href="data.html">Data Table</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact us</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h1>Dynamic Directory</h1>
      <p class="label">Live filter search and column sorting using JavaScript.</p>

      <div class="row" style="margin-bottom: 20px; justify-content: space-between;">
        <div style="flex: 1; max-width: 300px;">
          <input type="text" id="filterInput" placeholder="Type to filter..." style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text);">
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btnSortName" class="btn btn-outline" type="button">Order by Name</button>
          <button id="btnSortAge" class="btn btn-outline" type="button">Order by Age</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Age</th>
              <th>City</th>
            </tr>
          </thead>
          <tbody id="recordsBody">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer" style="margin-top: 48px;">
    <div class="container">In-Lab Practice (DevHub)</div>
  </footer>

  <script>
    // Distinct dataset for differentiation
    const dataset = [
      { name: "John Doe", age: 29, city: "Cairo" },
      { name: "Emma Watson", age: 33, city: "Paris" },
      { name: "Liam Nesson", age: 52, city: "Dublin" },
      { name: "Sophia Loren", age: 24, city: "Rome" },
      { name: "Michael Chang", age: 40, city: "Tokyo" },
      { name: "Amira Hassan", age: 27, city: "Alexandria" }
    ];

    let itemsList = [...dataset];
    let sortToggle = { name: true, age: true };

    const recordsBody = document.querySelector("#recordsBody");
    const filterInput = document.querySelector("#filterInput");

    function renderRows(list) {
      recordsBody.innerHTML = "";

      if (list.length === 0) {
        const noRow = document.createElement("tr");
        const noCell = document.createElement("td");
        noCell.colSpan = 3;
        noCell.style.textAlign = "center";
        noCell.textContent = "No matching records found.";
        noRow.appendChild(noCell);
        recordsBody.appendChild(noRow);
        return;
      }

      list.forEach(item => {
        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        tdName.textContent = item.name;

        const tdAge = document.createElement("td");
        tdAge.textContent = item.age;

        const tdCity = document.createElement("td");
        tdCity.textContent = item.city;

        tr.append(tdName, tdAge, tdCity);
        recordsBody.appendChild(tr);
      });
    }

    // Filter while typing
    filterInput.addEventListener("keyup", (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = itemsList.filter(entry => 
        entry.name.toLowerCase().includes(keyword) || 
        entry.city.toLowerCase().includes(keyword)
      );
      renderRows(filtered);
    });

    // Sort by Name
    document.querySelector("#btnSortName").addEventListener("click", () => {
      itemsList.sort((a, b) => 
        sortToggle.name ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name)
      );
      sortToggle.name = !sortToggle.name;
      renderRows(itemsList);
    });

    // Sort by Age
    document.querySelector("#btnSortAge").addEventListener("click", () => {
      itemsList.sort((a, b) => sortToggle.age ? a.age - b.age : b.age - a.age);
      sortToggle.age = !sortToggle.age;
      renderRows(itemsList);
    });

    // Initial table load
    renderRows(itemsList);
  </script>
</body>
</html>
