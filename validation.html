<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevHub - User Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">DevHub</a>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="components.html">Components</a></li>
        <li><a class="active" href="validation.html">Validation</a></li>
        <li><a href="data.html">Data Table</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact us</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h1>Create Account</h1>
      <p class="label">Fill in the registration form. Form submission is handled via JS validation.</p>

      <div class="card" style="max-width: 500px; margin-top: 20px;">
        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="usrName">Full Name</label>
            <input type="text" id="usrName" name="usrName" placeholder="Enter your full name">
            <span class="error-msg" id="err-usrName"></span>
          </div>

          <div class="form-group">
            <label for="usrEmail">Email Address</label>
            <input type="email" id="usrEmail" name="usrEmail" placeholder="example@mail.com">
            <span class="error-msg" id="err-usrEmail"></span>
          </div>

          <div class="form-group">
            <label for="usrPass">Password</label>
            <input type="password" id="usrPass" name="usrPass" placeholder="Min. 8 characters">
            <span class="error-msg" id="err-usrPass"></span>
          </div>

          <div class="form-group">
            <label for="confirmPass">Confirm Password</label>
            <input type="password" id="confirmPass" name="confirmPass" placeholder="Repeat password">
            <span class="error-msg" id="err-confirmPass"></span>
          </div>

          <div class="form-group">
            <label for="usrAge">Age</label>
            <input type="number" id="usrAge" name="usrAge" placeholder="Enter your age">
            <span class="error-msg" id="err-usrAge"></span>
          </div>

          <button type="submit" class="btn">Register</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer" style="margin-top: 48px;">
    <div class="container">In-Lab Practice (DevHub)</div>
  </footer>

  <script>
    const form = document.querySelector("#signupForm");

    form.addEventListener("submit", (evt) => {
      evt.preventDefault();
      let isValid = true;

      // Reset all inline error spans
      document.querySelectorAll(".error-msg").forEach(span => span.textContent = "");

      // Value extraction
      const name = document.querySelector("#usrName").value.trim();
      const email = document.querySelector("#usrEmail").value.trim();
      const password = document.querySelector("#usrPass").value;
      const confirmPassword = document.querySelector("#confirmPass").value;
      const ageVal = document.querySelector("#usrAge").value;
      const ageNum = Number(ageVal);

      // Name validation
      if (!name) {
        document.querySelector("#err-usrName").textContent = "Please enter your name.";
        isValid = false;
      }

      // Email validation (Regex check)
      const mailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email) {
        document.querySelector("#err-usrEmail").textContent = "Email is required.";
        isValid = false;
      } else if (!mailPattern.test(email)) {
        document.querySelector("#err-usrEmail").textContent = "Invalid email format.";
        isValid = false;
      }

      // Password validation
      if (!password) {
        document.querySelector("#err-usrPass").textContent = "Password field is required.";
        isValid = false;
      } else if (password.length < 8) {
        document.querySelector("#err-usrPass").textContent = "Password must be at least 8 characters.";
        isValid = false;
      }

      // Confirm Password validation
      if (!confirmPassword) {
        document.querySelector("#err-confirmPass").textContent = "Please verify your password.";
        isValid = false;
      } else if (password !== confirmPassword) {
        document.querySelector("#err-confirmPass").textContent = "Password confirmation does not match.";
        isValid = false;
      }

      // Age validation
      if (!ageVal) {
        document.querySelector("#err-usrAge").textContent = "Age is required.";
        isValid = false;
      } else if (isNaN(ageNum) || ageNum < 18 || ageNum > 100) {
        document.querySelector("#err-usrAge").textContent = "Age must be a valid number between 18 and 100.";
        isValid = false;
      }

      if (isValid) {
        alert("Registration successfully completed!");
        form.reset();
      }
    });
  </script>
</body>
</html>
